{{ define "main" }}
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="items">
    {{- range .Pages }}
      <div class="item">
        <a class="item__title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{- with .Description }}<span class="item__meta"> — {{ . }}</span>{{ end }}
      </div>
    {{- end }}
  </div>
{{ end }}
